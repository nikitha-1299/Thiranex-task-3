<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taskora | Smart To-Do</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div>
                <p class="tag">THIRANEX TASK 3</p>
                <h1>My Tasks</h1>
                <p class="subtitle">Organize your day. Get things done.</p>
            </div>

            <div class="task-count">
                <span id="taskCount">0</span>
                <small>Tasks</small>
            </div>
        </header>

        <section class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
            >

            <button id="addBtn">+ Add Task</button>
        </section>

        <nav class="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="active">Active</button>
            <button class="filter" data-filter="completed">Completed</button>
        </nav>

        <main>
            <ul id="taskList"></ul>

            <div id="emptyState" class="empty">
                <div class="empty-icon">✓</div>
                <h2>No tasks yet</h2>
                <p>Add your first task and start being productive.</p>
            </div>
        </main>

        <footer>
            <span id="remaining">0 tasks remaining</span>
            <button id="clearCompleted">Clear Completed</button>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
